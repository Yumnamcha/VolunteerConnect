services:
  postgres:
    image: postgres:16
    container_name: volunteerconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volunteerconnect
      POSTGRES_USER: volunteer
      POSTGRES_PASSWORD: volunteer123
    ports:
      - "5432:5432"
    volumes:
      - volunteerconnect_pgdata:/var/lib/postgresql/data

volumes:
  volunteerconnect_pgdata:
